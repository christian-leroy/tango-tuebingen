name: Generate regular events and deploy

on:
  schedule:
    - cron: '0 0 * * 0'  # Jeden Sonntag um 00:00 UTC (02:00 MESZ / 01:00 MEZ)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install icalendar pytz

      - name: Generate events
        run: python scripts/generate_events.py

      - name: Commit generated events
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/milongas.json
          git diff --cached --quiet || git commit -m "Generate regular events"

      - name: Run tests
        run: python scripts/test_scripts.py

      - name: Run cleanup
        run: python scripts/cleanup.py

      - name: Commit cleanup
        run: |
          git add data/milongas.json data/archive.json
          git diff --cached --quiet || git commit -m "Cleanup: archive old milongas"

      - name: Generate iCal export
        run: python scripts/export_to_ical.py

      - name: Commit calendar
        run: |
          git add milongas-tue.ics
          git diff --cached --quiet || git commit -m "Update calendar"

      - name: Push all commits
        run: git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
