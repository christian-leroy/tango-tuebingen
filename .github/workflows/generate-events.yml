name: Generate regular events

on:
  schedule:
    - cron: '0 0 * * 0'  # Jeden Sonntag um 00:00 UTC (02:00 MESZ / 01:00 MEZ)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate events
        run: python scripts/generate_events.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/milongas.json
          git diff --cached --quiet || git commit -m "Generate regular events"
          git push
